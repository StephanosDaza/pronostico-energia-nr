[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "energia"
version = "0.1.0"
description = "Pronóstico day-ahead de demanda no regulada y precio de bolsa (Colombia, XM)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
